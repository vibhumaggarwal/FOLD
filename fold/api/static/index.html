<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOLD - Data to Video Encoding</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>FOLD</h1>
            <p>Fractal Optimized Layered Data</p>
        </header>

        <main>
            <div class="card" id="encode-card">
                <h2>Encode</h2>
                <p>Convert any file into a video file</p>
                <div class="upload-area" id="encode-upload">
                    <input type="file" id="encode-file" hidden>
                    <label for="encode-file" class="upload-label">
                        <span class="icon">📁</span>
                        <span class="text">Click to browse or drag file here</span>
                    </label>
                </div>
                <div id="encode-selected" class="selected-file hidden"></div>
                <button id="encode-btn" class="btn primary" disabled>Generate Video</button>
                <div id="encode-status" class="status"></div>
            </div>

            <div class="card" id="decode-card">
                <h2>Decode</h2>
                <p>Extract original data from a FOLD video</p>
                <div class="upload-area" id="decode-upload">
                    <input type="file" id="decode-file" accept="video/avi,video/mp4" hidden>
                    <label for="decode-file" class="upload-label">
                        <span class="icon">🎞️</span>
                        <span class="text">Click to browse or drag video here</span>
                    </label>
                </div>
                <div id="decode-selected" class="selected-file hidden"></div>
                <button id="decode-btn" class="btn primary" disabled>Extract Data</button>
                <div id="decode-status" class="status"></div>
            </div>
        </main>
    </div>
    <script src="/script.js"></script>
</body>
</html>
